name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:leaks -- --all
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Synth needs no credentials or Docker: image assets are built at deploy time only.
      - run: npm run synth
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-east-1
