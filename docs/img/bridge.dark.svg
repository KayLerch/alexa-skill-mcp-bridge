  <text x="905.5" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">5</text>
  <line x1="24" y1="290" x2="1096" y2="290" stroke="#21262d" stroke-width="1"/>
  <circle cx="33" cy="316" r="9" fill="#4cc2f0"/>
  <text x="33" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">1</text>
  <text x="48" y="320" font-size="11" fill="#9198a1">The user speaks to an Alexa+ device, or types in the test simulator.</text>
  <circle cx="33" cy="340" r="9" fill="#4cc2f0"/>
  <text x="33" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">2</text>
  <text x="48" y="344" font-size="11" fill="#9198a1">Alexa+ matches utterances against the Alexa Skill's interaction model, generated from your tools.</text>
  <circle cx="33" cy="364" r="9" fill="#4cc2f0"/>
  <text x="33" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">3</text>
  <text x="48" y="368" font-size="11" fill="#9198a1">The Alexa Skill Lambda forwards the request. It holds no MCP and no model logic.</text>
  <circle cx="33" cy="388" r="9" fill="#4cc2f0"/>
  <text x="33" y="392" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">4</text>
  <text x="48" y="392" font-size="11" fill="#9198a1">The agent picks a tool, fills its arguments, and calls your server over Streamable HTTP.</text>
  <circle cx="581" cy="316" r="9" fill="#768390"/>
  <text x="581" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">5</text>
  <text x="596" y="320" font-size="11" fill="#9198a1">Your server returns a result, or asks a question back through elicitation.</text>
  <circle cx="581" cy="340" r="9" fill="#768390"/>
  <text x="581" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">6</text>
  <text x="596" y="344" font-size="11" fill="#9198a1">The agent turns that into one short spoken answer, or into the question to ask.</text>
  <circle cx="581" cy="364" r="9" fill="#768390"/>
  <text x="581" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">7</text>
  <text x="596" y="368" font-size="11" fill="#9198a1">The Lambda renders it as SSML and hands it back to Alexa+.</text>
  <circle cx="581" cy="388" r="9" fill="#768390"/>
  <text x="581" y="392" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">8</text>
  <text x="596" y="392" font-size="11" fill="#9198a1">The device speaks. A parked question resumes the same call on the next turn.</text>
