<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1056" width="920" height="1056" role="img" aria-label="One Alexa turn, top to bottom: the Alexa+ device sends voice to the Alexa Skill, which matches it to an intent and slots and calls the thin Alexa Skill Lambda. Inside AWS us-east-1 the Lambda invokes AgentCore Runtime, one microVM per user holding a Strands agent on Nova 2 Lite, an MCP client over Streamable HTTP and AgentCore Memory. It calls your MCP server, which sits outside AWS. Every step has a return arrow beside it, and the answer travels the whole way back as speech the device says.">
